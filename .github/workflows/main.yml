
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OneWho AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Download project source
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Step 4: Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 5: Verify project files
      - name: Verify Android project
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

      # Step 6: Compile the Android APK
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      # Step 7: Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneWho-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
