
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OneWho AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: OneWho-Android

    steps:
      # 1. Download repository source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. Install Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Verify Android project structure
      - name: Verify Android project
        run: |
          echo "Checking OneWho AI Android project..."
          pwd
          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app/src/main

          echo "Android project files found."

      # 6. Display Gradle version
      - name: Check Gradle
        run: gradle --version

      # 7. Build debug APK
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      # 8. Verify generated APK
      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK for download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneWho-AI-debug
          path: OneWho-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
